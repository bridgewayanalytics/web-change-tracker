name: Deploy Pipeline

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!dashboard/**'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_email_from: "Isaiah.Levy@bridgewayanalytics.com"
      TF_VAR_email_to: "isaiah.levy@bridgewayanalytics.com,Amnon.Levy@bridgewayanalytics.com"

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815039343351:role/github-actions-web-change-tracker
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init
        working-directory: infra/terraform

      - name: Verify Terraform outputs
        run: |
          echo "Region: $(terraform output -raw region)"
          echo "ECR URL: $(terraform output -raw ecr_repository_url)"
        working-directory: infra/terraform

      - name: Deploy
        run: AWS_PROFILE="" ./scripts/deploy.sh --tag "${{ github.sha }}"
