name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'

jobs:
  deploy:
    name: Build & Deploy Dashboard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::815039343351:role/github-actions-web-change-tracker
          aws-region: us-east-1

      - name: Deploy
        run: ./dashboard/scripts/deploy.sh --tag "${{ github.sha }}" --skip-terraform
