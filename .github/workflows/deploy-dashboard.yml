name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'

jobs:
  deploy:
    name: Build & Deploy Dashboard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815039343351:role/github-actions-web-change-tracker
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init
        working-directory: dashboard/infra/terraform

      - name: Deploy
        run: AWS_PROFILE="" ./dashboard/scripts/deploy.sh --tag "${{ github.sha }}"
